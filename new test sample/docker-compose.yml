version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: fintech-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-tranning}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p${MYSQL_ROOT_PASSWORD:-root} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  authorization-service:
    build:
      context: ./authorization-service
    container_name: authorization-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
      DB_URL: ${AUTH_DB_URL:-jdbc:mysql://mysql:3306/tranning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${AUTH_DB_USERNAME:-root}
      DB_PASSWORD: ${AUTH_DB_PASSWORD:-root}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret}
      JWT_ISSUER: ${JWT_ISSUER:-ledger-auth}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
    # Intentionally not exposing service ports; access via gateway only.

  core-application-service:
    build:
      context: ./core-application-service
    container_name: core-application-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8082
      DB_URL: ${CORE_DB_URL:-jdbc:mysql://mysql:3306/tranning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${CORE_DB_USERNAME:-root}
      DB_PASSWORD: ${CORE_DB_PASSWORD:-root}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret}
      JWT_ISSUER: ${JWT_ISSUER:-ledger-auth}
    # Intentionally not exposing service ports; access via gateway only.

  user-service:
    build:
      context: ./user-service
    container_name: user-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8084
      DB_URL: ${USER_DB_URL:-jdbc:mysql://mysql:3306/tranning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${USER_DB_USERNAME:-root}
      DB_PASSWORD: ${USER_DB_PASSWORD:-root}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret}
      JWT_ISSUER: ${JWT_ISSUER:-ledger-auth}
    # Intentionally not exposing service ports; access via gateway only.

  notification-service:
    build:
      context: ./notification-service
    container_name: notification-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8085
      DB_URL: ${NOTIFICATION_DB_URL:-jdbc:mysql://mysql:3306/tranning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${NOTIFICATION_DB_USERNAME:-root}
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-root}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret}
      JWT_ISSUER: ${JWT_ISSUER:-ledger-auth}
    # Intentionally not exposing service ports; access via gateway only.

  file-service:
    build:
      context: ./file-service
    container_name: file-service
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8086
      DB_URL: ${FILE_DB_URL:-jdbc:mysql://mysql:3306/tranning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
      DB_USERNAME: ${FILE_DB_USERNAME:-root}
      DB_PASSWORD: ${FILE_DB_PASSWORD:-root}
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      FILES_STORAGE_DIR: ${FILES_STORAGE_DIR:-/app/data/files}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-dev-secret-dev-secret-dev-secret}
      JWT_ISSUER: ${JWT_ISSUER:-ledger-auth}
    # Intentionally not exposing service ports; access via gateway only.
    volumes:
      - file_data:/app/data

  gateway:
    image: nginx:1.27-alpine
    container_name: api-gateway
    environment:
      # Defaults route to docker services; override for "backends running on host":
      # AUTH_UPSTREAM=host.docker.internal:8081
      # CORE_UPSTREAM=host.docker.internal:8082
      # USER_UPSTREAM=host.docker.internal:8084
      AUTH_UPSTREAM: ${AUTH_UPSTREAM:-authorization-service:8081}
      CORE_UPSTREAM: ${CORE_UPSTREAM:-core-application-service:8082}
      USER_UPSTREAM: ${USER_UPSTREAM:-user-service:8084}
      NOTIFICATION_UPSTREAM: ${NOTIFICATION_UPSTREAM:-notification-service:8085}
      FILE_UPSTREAM: ${FILE_UPSTREAM:-file-service:8086}
    # Ensures host-mode upstreams work reliably (especially on non-Windows hosts).
    # Safe on Windows/macOS too.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/nginx/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./infra/nginx/docker-entrypoint.sh:/gateway-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/gateway-entrypoint.sh"]

volumes:
  mysql_data:
  file_data:
