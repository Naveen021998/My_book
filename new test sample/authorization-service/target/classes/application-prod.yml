spring:
  main:
    banner-mode: off
  datasource:
    url: ${DB_URL:jdbc:mysql://mysql:3306/tranning?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

app:
  user-service:
    base-url: ${USER_SERVICE_BASE_URL:http://user-service:8084}