server:
  port: ${SERVER_PORT:8080}

upstreams:
  # Local host-mode defaults (no Docker)
  auth: ${AUTH_UPSTREAM:http://localhost:8081}
  core: ${CORE_UPSTREAM:http://localhost:8082}
  user: ${USER_UPSTREAM:http://localhost:8084}
  notification: ${NOTIFICATION_UPSTREAM:http://localhost:8085}
  file: ${FILE_UPSTREAM:http://localhost:8086}

spring:
   application:
     name: api-gateway-service
   profiles:
     default: test
   main:
     web-application-type: reactive

app:
  internal:
    token: ${INTERNAL_TOKEN:dev-internal-token}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
